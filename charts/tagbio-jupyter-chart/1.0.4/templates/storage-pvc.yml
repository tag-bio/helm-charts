apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tagbio-jupyter-storage-pvc
  labels:
    jupyter.tag.bio/name: tagbio-jupyter-storage-pvc
spec:
  accessModes:
    - ReadWriteOnce
    - ReadOnlyMany
    - ReadWriteMany
  resources:
    requests:
      storage: 1000Gi
  volumeName: tagbio-jupyter-storage-pv
