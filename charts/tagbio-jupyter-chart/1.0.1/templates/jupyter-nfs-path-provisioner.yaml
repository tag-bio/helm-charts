apiVersion: batch/v1
kind: Job
metadata:
  name: jupyter-nfs-path-create-job
  namespace: {{ .Values.platform.namespaces.system }}
spec:
  template:
    metadata:
      labels:
        job-name: jupyter-nfs-path-create-job
    spec:
      containers:
        - command: ['sh', '-c', 'mkdir -p /nfs-root/jupyter']
          image: alpine
          name: jupyter-nfs-path-create-job-mkdir
          volumeMounts:
            - name: nfs-client-root
              mountPath: /nfs-root
      restartPolicy: OnFailure
      volumes:
        - name: nfs-client-root
          nfs:
            server: {{ .Values.environment.nfs.host }}
            path: {{ .Values.environment.nfs.path }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter-nfs-path-provisioner
  labels:
    app: jupyter-nfs-path-provisioner
  namespace: {{ .Values.platform.namespaces.system }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jupyter-nfs-path-provisioner
  template:
    metadata:
      labels:
        app: jupyter-nfs-path-provisioner
    spec:
      serviceAccountName: nfs-path-provisioner
      containers:
        - name: jupyter-nfs-path-provisioner
          image: {{ .Values.platform.services.nfsPathProvisioner.image }}:{{ .Values.platform.services.nfsPathProvisioner.tag }}
          volumeMounts:
            - name: nfs-client-root
              mountPath: /persistentvolumes
          env:
            - name: PROVISIONER_NAME
              value: jupyter-nfs-path-provisioner
            - name: NFS_SERVER
              value: {{ .Values.environment.nfs.host }}
            - name: NFS_PATH
              value: /jupyter
      volumes:
        - name: nfs-client-root
          nfs:
            server: {{ .Values.environment.nfs.host }}
            path: /jupyter
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: jupyter-nfs-path-storage
provisioner: jupyter-nfs-path-provisioner
parameters:
  archiveOnDelete: "false"
  pathPattern: "${.PVC.name}"
