apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    jupyter.tag.bio/name: tagbio-jupyter-hub-storage-pv
  name: tagbio-jupyter-hub-storage-pv
spec:
  accessModes:
    - ReadOnlyMany
    - ReadWriteMany
    - ReadWriteOnce
  capacity:
    storage: 10Gi
  nfs:
    path: /jupyter/hub
    readOnly: false
    server: {{ .Values.environment.nfs.host }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tagbio-jupyter-users-storage-pv
spec:
  accessModes:
    - ReadOnlyMany
    - ReadWriteMany
    - ReadWriteOnce
  capacity:
    storage: 10Gi
  nfs:
    path: /jupyter/users
    readOnly: false
    server: {{ .Values.environment.nfs.host }}
