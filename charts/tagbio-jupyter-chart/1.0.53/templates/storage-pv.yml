---
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    jupyter.tag.bio/name: tagbio-jupyter-hub-storage-pv
  name: tagbio-jupyter-hub-storage-pv
spec:
{{ if eq .Values.environment.storageVolumeType "azureFile" }}
  azureFile:
    readOnly: false
    secretName: {{ .Values.environment.azure.secret.name }}
    secretNamespace: {{ .Values.environment.azure.secret.namespace }}
    shareName: {{ .Values.environment.azure.fileshare.name }}
  mountOptions:
    - 'nolock'
    - 'prefixpath=/jupyter/hub'
{{ end }}
{{ if eq .Values.environment.storageVolumeType "nfs" }}
  nfs:
    path: /jupyter/hub
    readOnly: false
    server: {{ .Values.environment.nfs.host }}
{{ end }}
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1000Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tagbio-jupyter-users-storage-pv
spec:
{{ if eq .Values.environment.storageVolumeType "azureFile" }}
  azureFile:
    readOnly: false
    secretName: {{ .Values.environment.azure.secret.name }}
    secretNamespace: {{ .Values.environment.azure.secret.namespace }}
    shareName: {{ .Values.environment.azure.fileshare.name }}
  mountOptions:
    - 'nolock'
    - 'prefixpath=/jupyter/users'
{{ end }}
{{ if eq .Values.environment.storageVolumeType "nfs" }}
  nfs:
    path: /jupyter/users
    readOnly: false
    server: {{ .Values.environment.nfs.host }}
{{ end }}
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 1000Gi
