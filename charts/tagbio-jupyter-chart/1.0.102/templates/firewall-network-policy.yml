apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tagbio-firewall-network-policy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      firewall.tag.bio/role: protected
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              firewall.tag.bio/role: gateway
          namespaceSelector:
            matchLabels:
              firewall.tag.bio/role: gateway
