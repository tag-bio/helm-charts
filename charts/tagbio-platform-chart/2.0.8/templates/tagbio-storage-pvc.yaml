    secretNamespace: {{ .Values.environment.azure.secret.namespace }}
    shareName: {{ .Values.environment.azure.fileshare.name }}
  mountOptions:
    - 'dir_mode=0755'
    - 'file_mode=0644'
    - 'nolock'
{{ end }}
{{ if eq .Values.environment.storageVolumeType "nfs" }}
  nfs:
    path: {{ .Values.environment.nfs.path }}
    readOnly: false
    server: {{ .Values.environment.nfs.host }}
{{ end }}
{{ if eq .Values.environment.storageVolumeType "efs" }}
  csi:
    driver: efs.csi.aws.com
    volumeHandle: {{ .Values.environment.efs.fileSystemId }}:{{ .Values.environment.nfs.path }}
{{ end }}
  storageClassName: ""
