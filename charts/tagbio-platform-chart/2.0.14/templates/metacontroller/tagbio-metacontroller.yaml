{{- /* 2.0: muhdo-prod gets metacontroller from a separate Fleet infra bundle; set tagbio.metacontroller.enabled=false there until that bundle is retired */}}
{{- if .Values.tagbio.metacontroller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    workload.user.cattle.io/workloadselector: deployment-tagbio-metacontroller
  name: tagbio-metacontroller
  namespace: {{ .Values.tagbio.namespaces.platform }}
spec:
  replicas: 1
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: deployment-tagbio-metacontroller
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
{{- with .Values.tagbio.podAnnotations }}
      annotations:
{{ toYaml . | indent 8 }}
{{- end }}
      labels:
{{- if .Values.tagbio.metacontroller.forceRestartOnUpgrade }}
        deployment.tag.bio/force-randomizer: {{ randAlphaNum 25 }}
{{- end }}
        workload.user.cattle.io/workloadselector: deployment-tagbio-metacontroller
    spec:
{{ include "tagbio.controllerAffinity" . | indent 6 }}
      containers:
      - image: metacontroller/jsonnetd
        imagePullPolicy: Always
        name: tagbio-metacontroller
        volumeMounts:
        - mountPath: /tagbio-hooks
          name: hooks
        workingDir: /tagbio-hooks
      imagePullSecrets:
      - name: docker-hub-creds
      volumes:
      - configMap:
          defaultMode: 256
          name: tagbio-metacontroller-hooks
          optional: true
        name: hooks
---
apiVersion: v1
kind: Service
metadata:
  name: tagbio-metacontroller
  namespace: {{ .Values.tagbio.namespaces.platform }}
spec:
  clusterIP: None
  ports:
  - name: default
    port: 42
    protocol: TCP
    targetPort: 42
  selector:
    workload.user.cattle.io/workloadselector: deployment-tagbio-metacontroller
  sessionAffinity: None
  type: ClusterIP
{{- end }}
