{{- /* 2.0: muhdo-prod gets metacontroller from a separate Fleet infra bundle; set tagbio.metacontroller.enabled=false there until that bundle is retired */}}
{{- /* 1.3.x created a legacy, unused namespace named "metacontroller" here while the metacontroller
       workloads render into .Values.tagbio.namespaces.platform. On the 1.3 sites that value equals the
       release namespace, so it always existed. 2.0 creates the platform namespace itself when it is
       not the release namespace (stage-dev: release "tagbio", platform "tagbio-platform"); when it is
       the release namespace (UCSF) nothing is rendered, so Helm never has to adopt a foreign Namespace. */}}
{{- if and .Values.tagbio.metacontroller.enabled (ne .Values.tagbio.namespaces.platform .Release.Namespace) }}
apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: metacontroller
  name: {{ .Values.tagbio.namespaces.platform }}
{{- end }}
