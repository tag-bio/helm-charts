---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tagbio-jupyter-users-storage-pvc
  annotations:
    helm.sh/resource-policy: keep
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1000Gi
  volumeName: tagbio-jupyter-users-storage-pv

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tagbio-jupyter-users-shared-storage-pvc
  annotations:
    helm.sh/resource-policy: keep
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1000Gi
  volumeName: tagbio-jupyter-users-shared-storage-pv
