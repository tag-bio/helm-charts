{{- if .Values.tagbio.coreStack.enabled -}}

# kung
{{- if (empty (lookup "v1" "Secret" .Values.tagbio.namespaces.app "kung")) }}
---
{{ include "tagbio.secretPreamble" (dict "name" "kung" "namespace" .Values.tagbio.namespaces.app )}}
  EG_CONFIG_DIR: /app/config-cluster
  KUNG_API_KEYS_FILE: /api-keys/api-keys.txt
  KUNG_COGNITO_CONFIG_URL: http://login-service:8000/well-known/configuration
  KUNG_IDP_CLIENT_IDS: tagbio-login-client
  KUNG_IDP_ISSUERS: https://{{ .Values.tagbio.hosts.cluster }}/login-service
  KUNG_PORT_HTTP: "8000"
  KUNG_PORT_HTTPS: "8443"
  KUNG_ROOT_PATH: ''
  KUNG_RUTHERFORD_HOST: rutherford
  KUNG_SERVICES_URI: http://kung-services:8001
  KUNG_SITE: {{ .Values.tagbio.site.name }}
  LOG_LEVEL: info
  NODE_ENV: production

{{- end }}
---
{{ include "tagbio.coreStackService" (dict "Chart" .Chart "firewall" "gateway" "name" "kung" "storageVolume" false "Values" .Values ) }}
---
{{- /* Ingress API: v1 on Kubernetes >= 1.19, else v1beta1. KubeVersion-based so `helm template --kube-version` and lint agree with real clusters. */}}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.Version }}
apiVersion: networking.k8s.io/v1
{{- else }}
apiVersion: networking.k8s.io/v1beta1
{{- end }}
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
{{- if .Values.tagbio.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.tagbio.ingress.clusterIssuer }}
{{- end }}
{{- with .Values.tagbio.ingress.annotations }}
{{ toYaml . | indent 4 }}
{{- end }}
  name: platform-gateway
  namespace: {{ .Values.tagbio.namespaces.app }}
spec:
{{- if .Values.tagbio.ingress.className }}
  ingressClassName: {{ .Values.tagbio.ingress.className }}
{{- end }}
{{- if .Values.tagbio.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.tagbio.hosts.cluster }}
{{- range .Values.tagbio.gateway.additionalTlsHosts }}
        - {{ . }}
{{- end }}
      secretName: tagbio-cluster
{{- end }}
  rules:
    - host: {{ .Values.tagbio.hosts.cluster }}
      http:
        paths:
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.Version }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kung
                port:
                  number: 8000
{{- else }}
          - path: /
            backend:
              serviceName: kung
              servicePort: 8000
{{- end }}

# kung-services
{{- if (empty (lookup "v1" "Secret" .Values.tagbio.namespaces.app "kung-services")) }}
---

{{ include "tagbio.secretPreamble" (dict "name" "kung-services" "namespace" .Values.tagbio.namespaces.app )}}
  DB_CONNECTION: /storage/kung-services/db/kung-services.sqlite
  LOG_LEVEL: info
  NODE_ENV: production
  PORT: "8001"
  SITE_NAME: {{ .Values.tagbio.site.name }}
  TAGBIO_BASE_URL: {{ .Values.tagbio.gateway.baseUrlExternal }}
  TAGBIO_ADMIN_EMAIL: {{ .Values.tagbio.site.adminEmail }}
  TAGBIO_BLOB_DIR: /storage/blobs

{{- end }}
---
{{ include "tagbio.coreStackService" (dict "Chart" .Chart "firewall" "protected" "name" "kung-services" "storageVolume" true "Values" .Values ) }}

# notification-service
{{- if (empty (lookup "v1" "Secret" .Values.tagbio.namespaces.app "notification-service")) }}
---

{{ include "tagbio.secretPreamble" (dict "name" "notification-service" "namespace" .Values.tagbio.namespaces.app )}}
  TAGBIO_EMAIL_FROM: "Tag.bio Notifications <support@tag.bio>"
  TAGBIO_EMAIL_HOST: email-smtp.us-west-2.amazonaws.com
  TAGBIO_EMAIL_PASSWORD: REPLACE
  TAGBIO_EMAIL_PORT: '465'
  TAGBIO_EMAIL_SECURE: 'true'
  TAGBIO_EMAIL_USER: REPLACE

{{- end }}
---
{{ include "tagbio.coreStackService" (dict "Chart" .Chart "firewall" "protected" "name" "notification-service" "storageVolume" false "Values" .Values ) }}

{{ end }}
