{{- if .Values.tagbio.coreStack.enabled -}}

---
{{ include "tagbio.secretPreamble" (dict "name" "login-service" "namespace" .Values.tagbio.namespaces.app )}}
  config.yml: |-
    baseUrl: https://{{ .Values.tagbio.hosts.cluster }}/login-service
    clients:
      tagbio-login-client:
        redirectUris:
          - https://{{ .Values.tagbio.hosts.cluster }}/user
        secret: {{ uuidv4 }}
    cookies:
      domain: {{ .Values.tagbio.hosts.cluster }}
      httpOnly: true
      maxAge: 3600000
      sameSite: Lax
      secure: false
    tokenEncoding:
      algorithm: RS256
      expiresIn: 1h
      issuer: https://{{ .Values.tagbio.hosts.cluster }}/login-service
      keyid: tagbio-login-service
    strategy:
      name: initial-setup
      options:
        email: support@tag.bio
