    verifyOptions:
      algorithms:
        - RS256
      clockTolerance: 60
      issuer: https://{{ .Values.tagbio.hosts.cluster }}/login-service
      maxAge: 1h

---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    service-per-pod-label: deployment.tag.bio/name
    service-per-pod-ports: 8000:8000
  labels:
    deployment.tag.bio/name: login-service
    firewall.tag.bio/role: protected
  name: login-service
  namespace: {{ .Values.tagbio.namespaces.app }}
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      deployment.tag.bio/name: login-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        deployment.tag.bio/name: login-service
        deployment.tag.bio/helm-chart-version: {{ .Chart.Version }}
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: tagbio-controller
                operator: NotIn
                values:
                - "true"
            weight: 100
          - preference:
              matchExpressions:
              - key: tagbio-controller
                operator: DoesNotExist
            weight: 99
      containers:
        - env:
            - name: LOGIN_SERVICE_CONFIG_FILE
              value: /config/config.yml
            - name: LOGIN_SERVICE_PRIVATE_KEY
              value: /storage/login-service/login-service.key
          image: platform-registry.dev.tag.bio/login-service:{{ .Values.tagbio.imageTag }}
          imagePullPolicy: IfNotPresent
          name: login-service
          resources:
            requests:
              cpu: 100m
              memory: 500Mi
          stdin: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          tty: true
          volumeMounts:
            - mountPath: /config/
              name: config-yml
            - mountPath: /storage
              name: storage
      imagePullSecrets:
        - name: tagbio-platform-registry-creds
        - name: tagbio-cluster-registry-creds
      restartPolicy: Always
      volumes:
        - name: config-yml
          secret:
            defaultMode: 420
            items:
              - key: config.yml
                path: config.yml
            secretName: login-service
        - name: storage
          persistentVolumeClaim:
            claimName: tagbio-storage

{{ end }}