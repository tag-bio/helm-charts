{{- /* 2.0.14: each PV/PVC below renders only if it does not exist yet (lookup). They are hooks, and Helm's default hook policy deletes and recreates hook objects before every run: on an upgrade that deleted an in-use PV (stuck Terminating behind pv-protection) and the hook timed out (mcp-prod, 2026-10-22). Offline renders (no cluster) are unchanged. */}}
{{- /* 2.0.2: sites whose jupyter PV/PVCs pre-exist with an immutable volume source (UCSF: NFS against the EFS DNS name) set tagbio.storage.createJupyterVolumes=false; the existing objects stay untouched. */}}
{{- if and (ne (toString .Values.jupyterhub.enabled) "false") .Values.tagbio.storage.createJupyterVolumes }}
---
{{- if not (lookup "v1" "PersistentVolume" "" "tagbio-jupyter-hub-storage-pv") }}
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    jupyter.tag.bio/name: tagbio-jupyter-hub-storage-pv
  name: tagbio-jupyter-hub-storage-pv
  annotations:
    helm.sh/resource-policy: keep
spec:
{{ if eq .Values.environment.storageVolumeType "azureFile" }}
  azureFile:
    readOnly: false
    secretName: {{ .Values.environment.azure.secret.name }}
    secretNamespace: {{ .Values.environment.azure.secret.namespace }}
    shareName: {{ .Values.environment.azure.fileshare.name }}/jupyter/hub
  mountOptions:
    - 'dir_mode=0700'
    - 'file_mode=0600'
    - 'gid=100'
    - 'nolock'
    - 'uid=1000'
{{ end }}
{{ if eq .Values.environment.storageVolumeType "nfs" }}
  nfs:
    path: {{ .Values.environment.nfs.pvPathPrefix | default .Values.environment.nfs.path | default "" }}/jupyter/hub
    readOnly: false
    server: {{ .Values.environment.nfs.host }}
{{ end }}
{{ if eq .Values.environment.storageVolumeType "efs" }}
  csi:
    driver: efs.csi.aws.com
    volumeHandle: {{ .Values.environment.efs.fileSystemId }}:/jupyter/hub
{{ end }}
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1000Gi
{{- end }}
---
{{- if not (lookup "v1" "PersistentVolume" "" "tagbio-jupyter-users-storage-pv") }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tagbio-jupyter-users-storage-pv
  annotations:
    helm.sh/resource-policy: keep
spec:
{{ if eq .Values.environment.storageVolumeType "azureFile" }}
  azureFile:
    readOnly: false
    secretName: {{ .Values.environment.azure.secret.name }}
    secretNamespace: {{ .Values.environment.azure.secret.namespace }}
    shareName: {{ .Values.environment.azure.fileshare.name }}/jupyter/users
  mountOptions:
    - 'dir_mode=0700'
    - 'file_mode=0600'
    - 'gid=100'
    - 'nolock'
    - 'uid=1000'
{{ end }}
{{ if eq .Values.environment.storageVolumeType "nfs" }}
  nfs:
    path: {{ .Values.environment.nfs.pvPathPrefix | default .Values.environment.nfs.path | default "" }}/jupyter/users
    readOnly: false
    server: {{ .Values.environment.nfs.host }}
{{ end }}
{{ if eq .Values.environment.storageVolumeType "efs" }}
  csi:
    driver: efs.csi.aws.com
    volumeHandle: {{ .Values.environment.efs.fileSystemId }}:/jupyter/users
{{ end }}
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 1000Gi
{{- end }}
---
{{- if not (lookup "v1" "PersistentVolume" "" "tagbio-jupyter-users-shared-storage-pv") }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tagbio-jupyter-users-shared-storage-pv
  annotations:
    helm.sh/resource-policy: keep
spec:
{{ if eq .Values.environment.storageVolumeType "azureFile" }}
