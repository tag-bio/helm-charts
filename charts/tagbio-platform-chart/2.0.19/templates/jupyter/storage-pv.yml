    secretNamespace: {{ .Values.environment.azure.secret.namespace }}
    shareName: {{ .Values.environment.azure.fileshare.name }}/jupyter/users/tagbio-jupyter-shared
  mountOptions:
    - 'dir_mode=0700'
    - 'file_mode=0600'
    - 'gid=100'
    - 'nolock'
    - 'uid=1000'
{{ end }}
{{ if eq .Values.environment.storageVolumeType "nfs" }}
  nfs:
    path: {{ .Values.environment.nfs.pvPathPrefix | default .Values.environment.nfs.path | default "" }}/jupyter/users/tagbio-jupyter-shared
    readOnly: false
    server: {{ .Values.environment.nfs.host }}
{{ end }}
{{ if eq .Values.environment.storageVolumeType "efs" }}
  csi:
    driver: efs.csi.aws.com
    volumeHandle: {{ .Values.environment.efs.fileSystemId }}:/jupyter/users/tagbio-jupyter-shared
{{ end }}
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 1000Gi
{{- end }}
{{- end }}
