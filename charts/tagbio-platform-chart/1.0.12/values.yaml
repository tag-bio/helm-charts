environment:
  nfs:
    host: ''
    path: /
platform:
  namespaces:
    app: tagbio-app
    system: tagbio-system
  services:
    nfsPathProvisioner:
      image: quay.io/external_storage/nfs-client-provisioner
      tag: v3.1.0-k8s1.11
jupyterhub:
  auth:
    # type: dummy
    # dummy:
    #   password: 'tagbio123456!'
    type: custom
    custom:
      className: oauthenticator.generic.GenericOAuthenticator
      config:
        login_service: login-service
        client_id: tagbio-login-client
        client_secret: tagbio-login-client-secret
        token_url: https://app-aws-al2-200917.dev.tag.bio/login-service/auth/token
        userdata_url: https://app-aws-al2-200917.dev.tag.bio/login-service/auth/userInfo
        userdata_method: GET
        userdata_params: {'state': 'state'}
        username_key: email
  hub:
    cookieSecret: "1c1269e8a73f90cc5420d73b86abb9aacf5f0d6ccc3c7c31b3bf9a0fba621a38"
    db:
      type: "sqlite-memory"
    extraEnv:
      OAUTH2_AUTHORIZE_URL: https://app-aws-al2-200917.dev.tag.bio/login-service/auth/authorize
      OAUTH2_TOKEN_URL: https://app-aws-al2-200917.dev.tag.bio/login-service/auth/token
      OAUTH_CALLBACK_URL: https://jupyter-aws-al2-200917.dev.tag.bio/hub/oauth_callback
    networkPolicy:
      enabled: false
  ingress:
    enabled: true
    hosts:
      - "jupyter-aws-al2-200917.dev.tag.bio"
    tls:
      - hosts:
          - jupyter-aws-al2-200917.dev.tag.bio
        secretName: tagbio-cluster
  proxy:
    chp:
      networkPolicy:
        enabled: false
    secretToken: "1c1269e8a73f90cc5420d73b86abb9aacf5f0d6ccc3c7c31b3bf9a0fba621a38"
    service:
      type: ClusterIP
  singleuser:
    networkPolicy:
      enabled: false
    storage:
      dynamic:
        storageClass: tagbio-nfs-path-storage


