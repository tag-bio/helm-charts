{{- if .Values.tagbio.coreStack.enabled -}}

{{- /* 2.0.2: tagbio.coreStack.manageConfigSecrets=false keeps a hand-managed Secret (UCSF: SAML login config). Helm's default hook policy would otherwise delete and re-render it on every upgrade. */}}
{{- if .Values.tagbio.coreStack.manageConfigSecrets }}
---
{{ include "tagbio.secretPreamble" (dict "name" "login-service" "namespace" .Values.tagbio.namespaces.app )}}
  config.yml: |-
    baseUrl: https://{{ .Values.tagbio.hosts.cluster }}/login-service
    clients:
      tagbio-login-client:
        redirectUris:
{{- if not ( empty .Values.jupyterhub.hub.extraEnv.OAUTH_CALLBACK_URL )}}
          - {{ .Values.jupyterhub.hub.extraEnv.OAUTH_CALLBACK_URL }}
{{- end }}
          - https://{{ .Values.tagbio.hosts.cluster }}/user
{{- /* 2.0.3: the OAuth client secret the hub presents (OAUTH_CLIENT_SECRET, from Secret
       tagbio-oauth-client-secret in the release namespace) must equal the one login-service accepts.
       Order: values (a site that sets client_secret owns both sides) -> Secret tagbio-oauth-client-secret
       (any mode, not only externalSecrets; 2.0.1/2.0.2 gated this and re-rolled a random uuid on every
       upgrade, breaking studio login on stage-dev) -> the secret already in the live login-service Secret
       (stable across upgrades) -> a fresh uuid only on a first install with none of the above. */}}
{{- $oauthSecret := lookup "v1" "Secret" .Release.Namespace "tagbio-oauth-client-secret" }}
{{- $liveLogin := lookup "v1" "Secret" .Values.tagbio.namespaces.app "login-service" }}
{{- $liveSecret := "" }}
{{- if and $liveLogin $liveLogin.data (index $liveLogin.data "config.yml") }}
{{- $liveSecret = index $liveLogin.data "config.yml" | b64dec | regexFind "(?m)^[ \\t]*secret: [^\\s]+" | trim | trimPrefix "secret: " }}
{{- end }}
{{- if not (empty .Values.jupyterhub.hub.config.GenericOAuthenticator.client_secret) }}
        secret: {{ .Values.jupyterhub.hub.config.GenericOAuthenticator.client_secret }}
{{- else if and $oauthSecret $oauthSecret.data (index $oauthSecret.data "oauth-client-secret") }}
        secret: {{ index $oauthSecret.data "oauth-client-secret" | b64dec }}
{{- else if $liveSecret }}
        secret: {{ $liveSecret }}
{{- else }}
        secret: {{ uuidv4 }}
{{- end }}

    cookies:
      domain: {{ .Values.tagbio.hosts.cluster }}
      httpOnly: true
      maxAge: 36000000
      sameSite: Lax
      secure: true
    tokenEncoding:
      algorithm: RS256
      expiresIn: 1h
      issuer: https://{{ .Values.tagbio.hosts.cluster }}/login-service
      keyid: tagbio-login-service
    strategy:
      name: initial-setup
      options:
        email: support@tag.bio
    #strategy:
    #  name: saml
    #  options:
    #    acceptedClockSkewMs: 0
    #    #additionalParams:
    #    #  add: to
    #    #  each: request
    #    #additionalAuthorizeParams:
    #    #  add: to
    #    #  each: request
    #    #additionalLogoutParams:
    #    #  add: to
    #    #  each: request
    #    #attributeConsumingServiceIndex: optional
    #    #audience: optional
    #    authnContext: urn:oasis:names:tc:SAML:2.0:ac:classes:PasswordProtectedTransport
    #    authnRequestBinding: HTTP-REDIRECT # HTTP-POST HTTP-REDIRECT
    #    callbackUrl: https://{{ .Values.tagbio.hosts.cluster }}/login-service/auth/callback
    #    #decryptionCert: optional
    #    #decryptionPvk: optional
    #    disableRequestedAuthnContext: false # default false, true helps ADFS
    #    emailField: nameID
    #    entryPoint: ""
    #    forceAuthn: false # force sign in each time
    #    identifierFormat: urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress
    #    issuer: https://{{ .Values.tagbio.hosts.cluster }}/login-service
    #    #logoutUrl: optional # defaults to entryPoint
    #    #metadataUrl: ''
    #    #metadataXml: ''
    # strategy:
    #   name: oauth2
    #   options:
    #     authorizationURL: REPLACE
    #     callbackURL: https://{{ .Values.tagbio.hosts.cluster }}/login-service/auth/callback
    #     clientID: REPLACE
    #     clientSecret: REPLACE
    #     emailField: email
    #     logoutURL: REPLACE
    #     scope:
    #       - openid
    #       - email
    #       - profile
    #     tokenURL: REPLACE
    #     userInfoURL: REPLACE
    verifyOptions:
      algorithms:
        - RS256
      clockTolerance: 60
      issuer: https://{{ .Values.tagbio.hosts.cluster }}/login-service
      maxAge: 1h

{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    deployment.tag.bio/name: login-service
    firewall.tag.bio/role: protected
  name: login-service
  namespace: {{ .Values.tagbio.namespaces.app }}
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      deployment.tag.bio/name: login-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
{{- with .Values.tagbio.podAnnotations }}
      annotations:
{{ toYaml . | indent 8 }}
{{- end }}
      labels:
        deployment.tag.bio/name: login-service
        firewall.tag.bio/role: protected
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: tagbio-controller
                operator: NotIn
                values:
                - "true"
            weight: 100
          - preference:
              matchExpressions:
              - key: tagbio-controller
                operator: DoesNotExist
            weight: 99
{{- $csSN := ((.Values.tagbio.coreStack | default dict).stableNode | default dict) }}
{{- if $csSN.enabled }}
          - preference:
              matchExpressions:
              - key: {{ $csSN.labelKey | default "tagbio-stable" }}
                operator: In
                values:
                - {{ $csSN.labelValue | default "true" | quote }}
            weight: 100
{{- end }}
{{- if and $csSN.enabled $csSN.required }}
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: {{ $csSN.labelKey | default "tagbio-stable" }}
                operator: In
                values:
                - {{ $csSN.labelValue | default "true" | quote }}
{{- end }}
{{- if and $csSN.enabled (ternary $csSN.tolerate true (hasKey $csSN "tolerate")) }}
      tolerations:
        - key: {{ $csSN.taintKey | default ($csSN.labelKey | default "tagbio-stable") }}
          operator: Equal
          value: {{ $csSN.taintValue | default ($csSN.labelValue | default "true") | quote }}
          effect: NoSchedule
{{- end }}
      containers:
        - env:
            - name: LOGIN_SERVICE_CONFIG_FILE
              value: /config/config.yml
            - name: LOGIN_SERVICE_PRIVATE_KEY
              value: /storage/login-service/login-service.key
{{- $oauth := (.Values.tagbio.mcp | default dict).oauth | default dict }}
{{- if (include "tagbio.oauthEnabled" .) }}
            # OAuth sign-in for MCP connectors: tokens are audience-bound to this resource.
            # kung lists the same value in KUNG_IDP_CLIENT_IDS (set automatically, core-stack.yaml).
            - name: LOGIN_SERVICE_OAUTH_RESOURCES
              value: {{ include "tagbio.mcpResource" . | quote }}
{{- if $oauth.redirectHosts }}
            - name: LOGIN_SERVICE_OAUTH_REDIRECT_HOSTS
              value: {{ join "," $oauth.redirectHosts | quote }}
{{- end }}
{{- if eq (toString $oauth.allowLoopback) "false" }}
            - name: LOGIN_SERVICE_OAUTH_ALLOW_LOOPBACK
              value: "false"
{{- end }}
{{- end }}
          image: platform-registry.dev.tag.bio/login-service:{{ (.Values.tagbio.loginService | default dict).imageTag | default .Values.tagbio.imageTag }}
          imagePullPolicy: Always
          name: login-service
          resources:
            requests:
              cpu: 100m
              memory: 500Mi
          stdin: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          tty: true
          volumeMounts:
            - mountPath: /config/
              name: config-yml
            - mountPath: /storage
              name: storage
      imagePullSecrets:
        - name: tagbio-platform-registry-creds
        - name: tagbio-cluster-registry-creds
      restartPolicy: Always
      volumes:
        - name: config-yml
          secret:
            defaultMode: 420
            items:
              - key: config.yml
                path: config.yml
            secretName: login-service
        - name: storage
          persistentVolumeClaim:
            claimName: tagbio-storage
---
apiVersion: v1
kind: Service
metadata:
  name: login-service
  namespace: {{ .Values.tagbio.namespaces.app }}
spec:
  clusterIP: None
  ports:
  - name: default
    port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    deployment.tag.bio/name: login-service
  sessionAffinity: None
  type: ClusterIP

{{ end }}
