{{- if .Values.imagePullSecrets }}
{{- if .Values.imagePullSecrets.tagbioPlatformRegistry }}
---
apiVersion: v1
kind: Secret
metadata:
  name: tagbio-platform-registry-creds
  namespace: {{ .Values.tagbio.namespaces.app }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"email\":\"%s\",\"auth\":\"%s\"}}}" .Values.imagePullSecrets.tagbioPlatformRegistry.server .Values.imagePullSecrets.tagbioPlatformRegistry.username .Values.imagePullSecrets.tagbioPlatformRegistry.password .Values.imagePullSecrets.tagbioPlatformRegistry.email (printf "%s:%s" .Values.imagePullSecrets.tagbioPlatformRegistry.username .Values.imagePullSecrets.tagbioPlatformRegistry.password | b64enc) | b64enc }}
{{- end }}

{{- if .Values.imagePullSecrets.tagbioClusterRegistry }}
---
apiVersion: v1
kind: Secret
metadata:
  name: tagbio-cluster-registry-creds
  namespace: {{ .Values.tagbio.namespaces.app }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"email\":\"%s\",\"auth\":\"%s\"}}}" .Values.imagePullSecrets.tagbioClusterRegistry.server .Values.imagePullSecrets.tagbioClusterRegistry.username .Values.imagePullSecrets.tagbioClusterRegistry.password .Values.imagePullSecrets.tagbioClusterRegistry.email (printf "%s:%s" .Values.imagePullSecrets.tagbioClusterRegistry.username .Values.imagePullSecrets.tagbioClusterRegistry.password | b64enc) | b64enc }}
{{- end }}

{{- if .Values.imagePullSecrets.dockerHub }}
---
apiVersion: v1
kind: Secret
metadata:
  name: docker-hub-creds
  namespace: {{ .Values.tagbio.namespaces.app }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"https://index.docker.io/v1/\":{\"username\":\"%s\",\"password\":\"%s\",\"email\":\"%s\",\"auth\":\"%s\"}}}" .Values.imagePullSecrets.dockerHub.username .Values.imagePullSecrets.dockerHub.password .Values.imagePullSecrets.dockerHub.email (printf "%s:%s" .Values.imagePullSecrets.dockerHub.username .Values.imagePullSecrets.dockerHub.password | b64enc) | b64enc }}
{{- end }}

{{- /* Create registry creds in tagbio-system for the periodic-image-puller DaemonSet */}}
