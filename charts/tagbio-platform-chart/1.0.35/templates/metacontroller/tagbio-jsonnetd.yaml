apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    workload.user.cattle.io/workloadselector: deployment-metacontroller-tagbio-jsonnetd
  name: tagbio-jsonnetd
  namespace: metacontroller
spec:
  replicas: 1
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: deployment-metacontroller-tagbio-jsonnetd
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        workload.user.cattle.io/workloadselector: deployment-metacontroller-tagbio-jsonnetd
    spec:
      containers:
      - image: metacontroller/jsonnetd
        imagePullPolicy: Always
        name: tagbio-jsonnetd
        volumeMounts:
        - mountPath: /jsonnetd/hooks
          name: hooks
        workingDir: /jsonnetd/hooks
      imagePullSecrets:
      - name: docker-hub-creds
      volumes:
      - configMap:
          defaultMode: 256
          name: tagbio-hooks
          optional: true
        name: hooks
---
apiVersion: v1
kind: Service
metadata:
  name: tagbio-jsonnetd
  namespace: metacontroller
spec:
  clusterIP: None
  ports:
  - name: default
    port: 42
    protocol: TCP
    targetPort: 42
  selector:
    workload.user.cattle.io/workloadselector: deployment-metacontroller-tagbio-jsonnetd
  sessionAffinity: None
  type: ClusterIP
