---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tagbio-firewall-network-policy
  namespace: {{ ((.Values.tagbio.firewall).namespace) | default .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      firewall.tag.bio/role: protected
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              firewall.tag.bio/role: gateway
{{- with ((.Values.tagbio.firewall).extraFrom) }}
{{ toYaml . | indent 8 }}
{{- end }}
