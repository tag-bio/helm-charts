{{- if .Values.externalSecrets.enabled }}
# ExternalSecret resources — ESO resolves these from AWS Secrets Manager
# and creates corresponding K8s Secrets in the release namespace.
# The ClusterSecretStore "tagbio-aws-sm" must exist (deployed by infra/secret-store bundle).

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tagbio-oauth-client-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: tagbio-oauth-client-secret
    creationPolicy: Owner
  data:
    - secretKey: oauth-client-secret
      remoteRef:
        key: {{ (index .Values.externalSecrets.secrets "oauth-client-secret").remoteRef }}

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tagbio-cookie-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: tagbio-cookie-secret
    creationPolicy: Owner
  data:
    - secretKey: cookie-secret
      remoteRef:
        key: {{ (index .Values.externalSecrets.secrets "cookie-secret").remoteRef }}

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tagbio-proxy-secret-token
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: tagbio-proxy-secret-token
    creationPolicy: Owner
  data:
    - secretKey: proxy-secret-token
      remoteRef:
        key: {{ (index .Values.externalSecrets.secrets "proxy-secret-token").remoteRef }}

{{- end }}
