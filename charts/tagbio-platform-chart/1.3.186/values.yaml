azure:
  aadClientId: ''
  aadClientSecret: ''
  storageAccountKey: ''
  storageAccountName: ''
  subscriptionId: ''
  tenantId: ''
environment:
  aws:
    region: ''
  azure:
    fileshare:
      name: 'tagbio-shared'
    secret:
      name: 'tagbio-storage-azure-fileshare'
      namespace: 'tagbio-app'
  nfs:
    host: ''
    path: /
    # 1.3.175: optional prefix prepended to the three jupyter PV nfs paths.
    # Needed where the NFS export root is not "/" (e.g. GCP Filestore-style
    # exports: the share name must appear in the mount path, CharacterBio:
    # /tagbio_storage). Default "" keeps the render identical to <=1.3.174
    # for all existing environments. Do NOT reuse environment.nfs.path here.
    pvPathPrefix: ''
  efs:
    fileSystemId: '' # Uses EFS CIS Driver
  storageVolumeType: 'nfs'
jupyterhub:
  custom:
    enforceWorkerScheduling: false
  auth:
    admin:
      access: true
      users:
        - support@tag.bio
    custom:
      className: oauthenticator.generic.GenericOAuthenticator
      config:
        login_service: tag.bio
        client_id: tagbio-login-client
        client_secret: ""
        token_url: ""
        userdata_url: ""
        userdata_method: GET
        userdata_params: {'state': 'state'}
        username_key: email
    type: custom
    whitelist:
      users:
        - support@tag.bio
  hub:
    # JupyterHub 4.1.6: required for the tagbio-notebook images built
    # from Aug 2026 on (singleuser jupyterhub 5.x needs a scopes-aware
    # hub; the chart's default 0.10.6 image runs JupyterHub 1.2.2).
    image:
      name: jupyterhub/k8s-hub
      tag: "3.3.8"
    cookieSecret: ""
    db:
      pvc:
        selector:
          matchLabels:
            jupyter.tag.bio/name: tagbio-jupyter-hub-storage-pv
      type: "sqlite-pvc"
    extraConfig:
      97-enforce-worker-scheduling: |
        # Chart 1.3.174: keep user notebook pods off controller nodes.
        # Gated by custom.enforceWorkerScheduling (set true in env answers
        # together with tagbio.enforceWorkerScheduling). A user notebook
        # once OOMed the controller; soft preference was not enough.
        if get_config('custom.enforceWorkerScheduling', False):
            _terms = list(get_config('singleuser.extraNodeAffinity.required', []) or [])
            _terms.append({'matchExpressions': [
                {'key': 'tagbio-controller', 'operator': 'NotIn', 'values': ['true']}]})
            c.KubeSpawner.node_affinity_required = _terms
            print('worker-only scheduling enforced for user notebook pods')
      00-allow-hidden: |
        c.ContentsManager.allow_hidden = True
      01-allow-larger-files: |
        c.NotebookApp.tornado_settings = {"websocket_max_message_size": 1024 * 1024 * 1024 * 1024}  
      99-derive-oauth-urls: |
        # Self-healing OAuth config: the OAUTH2_* env vars (hub.extraEnv) have
        # repeatedly been lost in app-answer edits (2026-08-07 and 2026-08-12
        # demo outages: empty authorize_url -> infinite redirect loop). All
        # three URLs are derivable from values that live in the stable part of
        # the answers, so derive any that are missing. extraEnv, when present,
        # still wins because oauthenticator reads it first.
        import os
        try:
            _tok = get_config('auth.custom.config.token_url', '') or os.environ.get('OAUTH2_TOKEN_URL', '')
            if _tok:
                if not os.environ.get('OAUTH2_TOKEN_URL'):
                    c.GenericOAuthenticator.token_url = _tok
                if not os.environ.get('OAUTH2_AUTHORIZE_URL'):
                    c.GenericOAuthenticator.authorize_url = _tok.rsplit('/', 1)[0] + '/authorize'
            _hosts = get_config('ingress.hosts', [])
            if _hosts and not os.environ.get('OAUTH_CALLBACK_URL'):
                c.GenericOAuthenticator.oauth_callback_url = 'https://' + _hosts[0] + '/hub/oauth_callback'
            print('derive-oauth-urls: authorize/token/callback resolved')
        except Exception as _e:
            print('WARNING derive-oauth-urls skipped: %s' % _e)
    extraEnv:
      OAUTH2_AUTHORIZE_URL: ""
      OAUTH2_TOKEN_URL: ""
      OAUTH_CALLBACK_URL: ""
    initContainers:
      - command: ['sh', '-c', 'echo chowning; shopt -o dotglob; chown -vR jovyan:users /srv/jupyterhub']
        image: jupyterhub/k8s-hub:0.10.6
        imagePullPolicy: IfNotPresent
        name: chown
        securityContext:
          allowPrivilegeEscalation: false
          runAsGroup: 0
          runAsUser: 0
        volumeMounts:
        - mountPath: /srv/jupyterhub
          name: hub-db-dir
    labels:
      firewall.tag.bio/role: gateway
    networkPolicy:
      enabled: false
  imagePullSecrets:
    - name: docker-hub-creds
    - name: tagbio-cluster-registry-creds
    - name: tagbio-platform-registry-creds
  cull:
    timeout: 172800 # --timeout
  ingress:
    enabled: true
    hosts: []
    tls:
      - hosts: []
        secretName: tagbio-cluster
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 1g
  proxy:
    chp:
      networkPolicy:
        enabled: false
    secretToken: ""
    service:
      type: ClusterIP
  singleuser:
    defaultUrl: "/lab"
    extraAnnotations:
      service-per-pod-label: 'tag.bio/jupyter-podname'
      service-per-pod-ports: '8000:8000'
    extraEnv:
      EDITOR: "vim"
      JUPYTERHUB_SERVICE_URL: http://0.0.0.0:8888/user/$(JUPYTERHUB_USER)/
      TAGBIO_BASE_URL: http://kung.tagbio-app.svc.cluster.local:8000
    extraLabels:
      firewall.tag.bio/role: not-protected
      hub.jupyter.org/network-access-hub: 'true'
      io.cattle.field/appId: tagbio-platform
      tag.bio/jupyter-podname: 'jupyter-{username}'
      tag.bio/jupyter-username: '{username}'
    extraNodeAffinity:
      preferred:
        - preference:
            matchExpressions:
            - key: tagbio-controller
              operator: NotIn
              values:
              - "true"
          weight: 100
        - preference:
            matchExpressions:
            - key: tagbio-controller
              operator: DoesNotExist
          weight: 99
    image:
      name: platform-registry.dev.tag.bio/tagbio-notebook
      pullPolicy: Always
      tag: branch-master
      # name: jupyter/datascience-notebook
      # tag: 'lab-2.2.9'
    initContainers:
      - command: ['/usr/bin/bash', '-c', "echo copying and chowning; cp -nR /tagbio-notebook/tagbio-home-init/. /home/jovyan ; IFS=$'\n'; for file_name in $(find /home/jovyan/ -maxdepth 2); do chown -v jovyan:users \"$file_name\"; chmod -v go-rwx \"$file_name\"; done; "]
        image: platform-registry.dev.tag.bio/tagbio-notebook:branch-master
        imagePullPolicy: Always
        name: chown
        securityContext:
          allowPrivilegeEscalation: false
          runAsGroup: 0
          runAsUser: 0
        volumeMounts:
          - mountPath: /home/jovyan
            name: home
            subPath: '{username}'
    networkPolicy:
      enabled: false
    storage:
      extraVolumes:
        - name: jupyter-shared
          persistentVolumeClaim:
            claimName: tagbio-jupyter-users-shared-storage-pvc
      extraVolumeMounts:
        - mountPath: /home/jovyan/tagbio-jupyter-shared
          name: jupyter-shared
      static:
        pvcName: tagbio-jupyter-users-storage-pvc
        subPath: '{username}'
      type: static
tagbio:
  coreStack:
    enabled: true
  gateway:
    baseUrlExternal: https://cluster-host.domain
    baseUrlInternal: http://kung.tagbio-app.svc.cluster.local
  hosts:
    cluster: ''
    clusterManager: ''
  imageTag: branch-master
  # Seconds between image-puller recycles (each recycle re-checks the
  # registry digest and downloads only if the image changed)
  imagePullerIntervalSeconds: 3600
  # When true, FC pods (and via jupyterhub.custom.enforceWorkerScheduling,
  # hub/proxy and user notebook pods) are HARD-excluded from nodes labeled
  # tagbio-controller=true. Default false = legacy soft preference only.
  # Enable per environment AFTER confirming it has non-controller worker
  # nodes, or those pods become unschedulable.
  enforceWorkerScheduling: false
  namespaces:
    app: tagbio-app
    system: tagbio-system
  publicFcs:
    fc-buzz:
      enabled: false
      fcCommand:
        fcArgs:
          archive: ./archive.ser
          main: main.json
          python_sdk: "$TAGBIO_PY"
          groups: "true"
        jar: fc_csv_server.jar
        javaArgs:
          Xss: 5M
          Xmx: 8G
      livenessProbe:
        initialDelaySeconds: 60
      reservation:
        memory: 4G
    fc-catalyze:
      enabled: false
      fcCommand:
        fcArgs:
          archive: ./archive.ser
          main: main.json
          python_sdk: "$TAGBIO_PY"
          r_sdk: "$TAGBIO_R_UTILS"
          groups: "true"
        jar: fc_csv_server.jar
        javaArgs:
          Xss: 5M
          Xmx: 16G
      livenessProbe:
        initialDelaySeconds: 300
      reservation:
        memory: 8G
    # DEPRECATED, kept so an upgrade does not DELETE a running workload. 1.3.181
    # dropped this key outright, which would have removed the deployed fc-cbio-tcga on
    # the next `helm upgrade` -- the chart renders workloads from this map, so deleting a
    # key deletes the Deployment. fc-cbioportal-tcga supersedes it (same 32 cohorts, same
    # 10,967 samples, plus 4 apps and the aneuploidy fix). Retire this one deliberately
    # once the replacement is verified on demo: set enabled: false in the environment
    # answers first, confirm, then remove the key in a later chart version.
    fc-cbio-tcga:
      imageTag: branch-master
      enabled: false
      fcCommand:
        fcArgs:
          command: run_server
          manifest: manifest.json
          python_sdk: $TAGBIO_PY
          r_sdk: $TAGBIO_R_UTILS
          groups: "false"
        jar: fc_csv_server.jar
        javaArgs:
          Xss: 5M
          Xmx: 16G
      livenessProbe:
        initialDelaySeconds: 300
      reservation:
        memory: 8G

    # The six cbioportal products: one image, one workload each, selected by manifest.
    # Archives are NOT baked in -- archiveSync pulls each as an OCI artifact from the
    # registry into /storage before the FC starts, and  on the command line
    # overrides whatever the manifest declares. Pin  to a known archive digest to
    # make a deployment reproducible; leave it empty to take whatever :latest points at.
    # Xmx is measured per product (peak un-archive heap), not uniform.
    fc-cbioportal-tcga:
      # All six products run the ONE image the fc-cbioportal repo's CI publishes
      # (only branch-master), selected by manifest -- so name it explicitly rather
      # than defaulting to the workload key, and pin the tag rather than follow a
      # release-wide tagbio.imageTag.
      imageName: fc-cbioportal
      imageTag: branch-master
      enabled: false
      archiveSync:
        ref: platform-registry.dev.tag.bio/fc-archives/tcga:latest
        dest: /storage/data/cbioportal-data/archive.ser
        sha256: ""
        # Pull credentials default to the platform READ account in the
        # `tagbio-ci-docker` secret (TAGBIO_PLATFORM_REGISTRY_USER/_PASSWORD),
        # present in every deploy namespace -- nothing to set per environment.
        # Override credentialsSecret / usernameKey / passwordKey only where
        # that secret does not exist.
      fcCommand:
        fcArgs:
          # Required alongside a manifest carrying a data_model: with no command the
          # engine builds from source data the image does not have.
          command: run_server
          manifest: manifest_tcga.json
          archive: /storage/data/cbioportal-data/archive.ser
          python_sdk: $TAGBIO_PY
          r_sdk: $TAGBIO_R_UTILS
          groups: "false"
        jar: fc_csv_server.jar
        javaArgs:
          Xss: 5M
          Xmx: 16G
      livenessProbe:
        initialDelaySeconds: 300
      reservation:
        memory: 8G
    fc-cbioportal-tcga-gdc:
