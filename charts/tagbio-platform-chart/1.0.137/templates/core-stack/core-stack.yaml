{{- if .Values.tagbio.coreStack.enabled -}}

# kung
---
{{ include "tagbio.secretPreamble" (dict "name" "kung" "namespace" .Values.tagbio.namespaces.app )}}
  EG_CONFIG_DIR: /app/config-cluster
  KUNG_API_KEYS_FILE: /api-keys/api-keys.txt
  KUNG_COGNITO_CONFIG_URL: http://login-service:8000/well-known/configuration
  KUNG_IDP_CLIENT_IDS: tagbio-login-client
  KUNG_IDP_ISSUERS: https://{{ .Values.tagbio.hosts.cluster }}/login-service
  KUNG_PORT_HTTP: "8000"
  KUNG_PORT_HTTPS: "8443"
  KUNG_ROOT_PATH: ''
  KUNG_RUTHERFORD_HOST: rutherford
  KUNG_SERVICES_URI: http://kung-services:8001
  KUNG_SITE: {{ .Values.tagbio.site.name }}
  LOG_LEVEL: info
  NODE_ENV: production
---
{{ include "tagbio.coreStackService" (dict "Chart" .Chart "name" "kung" "storageVolume" true "Values" .Values ) }}

# kung-services
---
{{ include "tagbio.secretPreamble" (dict "name" "kung-services" "namespace" .Values.tagbio.namespaces.app )}}
  DB_CONNECTION: /storage/kung-services/db/kung-services.sqlite
  LOG_LEVEL: info
  NODE_ENV: production
  PORT: "8001"
  SITE_NAME: {{ .Values.tagbio.site.name }}
  TAGBIO_BASE_URL: {{ .Values.tagbio.gateway.baseUrlExternal }}
  TAGBIO_ADMIN_EMAIL: {{ .Values.tagbio.site.adminEmail }}
  TAGBIO_BLOB_DIR: /storage/blobs
---
{{ include "tagbio.coreStackService" (dict "Chart" .Chart "name" "kung-services" "storageVolume" true "Values" .Values ) }}

# login-service
---
{{ include "tagbio.secretPreamble" (dict "name" "login-service" "namespace" .Values.tagbio.namespaces.app )}}
  config.yml: |-
    baseUrl: https://{{ .Values.tagbio.hosts.cluster }}/login-service
    clients:
      tagbio-login-client:
        redirectUris:
          - https://{{ .Values.tagbio.hosts.cluster }}/user
        secret: <%- uuid.v4() %>
    cookies:
      domain: {{ .Values.tagbio.hosts.cluster }}
      httpOnly: true
      maxAge: 3600000
      sameSite: Lax
      secure: false
    tokenEncoding:
      algorithm: RS256
      expiresIn: 1h
      issuer: https://{{ .Values.tagbio.hosts.cluster }}/login-service
      keyid: tagbio-login-service
    strategy:
      name: initial-setup
      options:
        email: support@tag.bio
    #strategy:
    #  name: saml
    #  options:
    #    acceptedClockSkewMs: 0
    #    #additionalParams:
    #    #  add: to
    #    #  each: request
    #    #additionalAuthorizeParams:
    #    #  add: to
    #    #  each: request
    #    #additionalLogoutParams:
    #    #  add: to
    #    #  each: request
    #    #attributeConsumingServiceIndex: optional
    #    #audience: optional
    #    authnContext: urn:oasis:names:tc:SAML:2.0:ac:classes:PasswordProtectedTransport
    #    authnRequestBinding: HTTP-REDIRECT # HTTP-POST HTTP-REDIRECT
    #    callbackUrl: https://{{ .Values.tagbio.hosts.cluster }}/login-service/auth/callback
    #    #decryptionCert: optional
    #    #decryptionPvk: optional
    #    disableRequestedAuthnContext: false # default false, true helps ADFS
    #    emailField: nameID
    #    entryPoint: ""
    #    forceAuthn: false # force sign in each time
    #    identifierFormat: urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress
    #    issuer: https://{{ .Values.tagbio.hosts.cluster }}/login-service
    #    #logoutUrl: optional # defaults to entryPoint
    #    #metadataUrl: ''
    #    #metadataXml: ''
    # strategy:
    #   name: oauth2
    #   options:
    #     authorizationURL: REPLACE
    #     callbackURL: https://{{ .Values.tagbio.hosts.cluster }}/login-service/auth/callback
    #     clientID: REPLACE
    #     clientSecret: REPLACE
    #     emailField: email
    #     logoutURL: REPLACE
    #     scope:
    #       - openid
    #       - email
    #       - profile
    #     tokenURL: REPLACE
    #     userInfoURL: REPLACE
    verifyOptions:
      algorithms:
        - RS256
      clockTolerance: 60
      issuer: https://{{ .Values.tagbio.hosts.cluster }}/login-service
      maxAge: 1h

---
{{ include "tagbio.coreStackService" (dict "Chart" .Chart "name" "login-service" "storageVolume" true "Values" .Values ) }}

# notification-service
---
{{ include "tagbio.secretPreamble" (dict "name" "notification-service" "namespace" .Values.tagbio.namespaces.app )}}
  TAGBIO_EMAIL_FROM: Tag.bio Notifications <support@support.tag.bio>
  TAGBIO_EMAIL_HOST: email-smtp.us-west-2.amazonaws.com
  TAGBIO_EMAIL_PASSWORD: REPLACE
  TAGBIO_EMAIL_PORT: '465'
  TAGBIO_EMAIL_SECURE: 'true'
  TAGBIO_EMAIL_USER: REPLACE
---
{{ include "tagbio.coreStackService" (dict "Chart" .Chart "name" "notification-service" "storageVolume" true "Values" .Values ) }}

# rutherford
---
{{ include "tagbio.secretPreamble" (dict "name" "rutherford" "namespace" .Values.tagbio.namespaces.app )}}
  tagbio-environment.js: |-
    window.TAGBIO_ENVIRONMENT = {
      production: true,
      history_flag: true,
      tagadmin_flag: true,
      site_provider: "kung",
      authentication: "saml",
      tagadmin: {
        apiUrl: "https://{{ .Values.tagbio.hosts.cluster }}/admin-service"
      },
      history: 'kung',
      gateway: 'https://{{ .Values.tagbio.hosts.cluster }}/',
      firebase: {
        apiKey: null,
        authDomain: null,
        databaseURL: null,
        storageBucket: null,
        projectId: null,
        messagingSenderId: null
      },
      algolia: {
        appId: "",
        apiKey: "",
      },
      ga: null,
      cognito: {
        region: "{{ .Values.environment.aws.region }}",
        userPoolId: "UNUSED",
        userPoolWebClientId: "tagbio-login-client",
        userPoolDomain: "https://{{ .Values.tagbio.hosts.cluster }}/login-service",
        mandatorySignIn: true,
        IdentityPoolId: null,
        login_provider: "{{ .Values.tagbio.hosts.cluster }}/login-service",
        saml:
          "https://{{ .Values.tagbio.hosts.cluster }}/login-service/auth/authorize?client_id=tagbio-login-client&redirect_uri=<YOUR_SITE_URL>&state=s&scope=openid+profile+email&response_type=token",
        google_client_id: null
      },
      default_site: null
    };

---
{{ include "tagbio.coreStackService" (dict "Chart" .Chart "name" "rutherford" "storageVolume" true "Values" .Values ) }}


{{ end }}
